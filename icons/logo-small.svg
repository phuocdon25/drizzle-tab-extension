<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1a1d4a"/>
      <stop offset="0.6" stop-color="#3a2f6e"/>
      <stop offset="1" stop-color="#8a5a8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.4">
      <stop offset="0" stop-color="#ffd38a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd6f5"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>
  <!-- crescent moon -->
  <path d="M92 18a18 18 0 1 0 14 29a15 15 0 1 1 -14 -29z" fill="#ffd38a"/>
  <!-- cloud -->
  <path d="M34 78h56a14 14 0 0 0 0-28a20 20 0 0 0-38-4a14 14 0 0 0-18 32z" fill="url(#cloud)"/>
  <!-- drizzle -->
  <g stroke="#9fd2ff" stroke-width="8" stroke-linecap="round">
    <path d="M50 90l-6 15"/>
    
    <path d="M82 90l-6 15"/>
  </g>
</svg>
